[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classify"
version = "0.1.0"
description = "Classify a directory of images with a vision model into a searchable catalog (OKF bundle, JSON, or both), so agents and programs can find images by what is in them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]

[project.scripts]
image-classify = "image_classify.cli:main"

[tool.setuptools]
packages = ["image_classify"]
